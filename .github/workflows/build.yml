name: Build whitelists

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Daily 1am UTC (4am MSK)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --output=./output .

      - name: Verify artifacts
        run: |
          test -f output/whitedomains.dat
          test -f output/whiteips.dat
          test -f output/whitedomains.list
          test -f output/category-ru.list
          test -f output/youtube.list
          ls -lh output/

      - name: Generate release tag
        id: tag
        run: echo "tag=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            **v2ray/xray routing rules:**
            ```
            ext:whitedomains.dat:direct
            ext:whiteips.dat:direct
            ```
            **Shadowrocket / Surge rule-sets:**
            ```
            RULE-SET,https://github.com/farestz/whitelists/releases/latest/download/whitedomains.list,DIRECT
            RULE-SET,https://github.com/farestz/whitelists/releases/latest/download/category-ru.list,DIRECT
            RULE-SET,https://github.com/farestz/whitelists/releases/latest/download/youtube.list,PROXY
            ```
            `whitedomains.list` = curated RU whitelist (geosite:direct twin); `category-ru`/`youtube` from Loyalsoldier geosite.
          files: |
            output/whitedomains.dat
            output/whiteips.dat
            output/whitedomains.list
            output/category-ru.list
            output/youtube.list
            output/whitedomains.dat.sha256sum
            output/whiteips.dat.sha256sum
            output/whitedomains.list.sha256sum
            output/category-ru.list.sha256sum
            output/youtube.list.sha256sum
