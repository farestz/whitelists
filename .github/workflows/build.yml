name: Build whitelists

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Daily 1am UTC (4am MSK)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --output=./output .

      - name: Verify artifacts
        run: |
          test -f output/whitedomains.dat
          test -f output/whiteips.dat
          ls -lh output/

      - name: Generate release tag
        id: tag
        run: echo "tag=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            **Usage in v2ray/xray routing rules:**
            ```
            ext:whitedomains.dat:direct
            ext:whiteips.dat:direct
            ```
          files: |
            output/whitedomains.dat
            output/whiteips.dat
            output/whitedomains.dat.sha256sum
            output/whiteips.dat.sha256sum
